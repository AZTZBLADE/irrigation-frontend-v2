<div class="auth">
  <div class="auth__left">
    <div class="brand">
      <div class="brand__logo">🌿</div>
      <div class="brand__name">Irrigation Manager</div>
    </div>
  </div>

  <div class="auth__right">
    <div class="card">
      <h1>Sign In</h1>

      <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- Email -->
        <label>Email Address</label>
        <div class="field">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M4 6h16v12H4V6zm8 7L5.5 8.5V8l6.5 4.5L18.5 8V8.5L12 13z"></path>
            </svg>
          </span>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="example@email.com" />
        </div>

        <!-- Password -->
        <label>Password</label>
        <div class="field">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"></path>
            </svg>
          </span>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="Enter your password" />
        </div>

        <!-- Button -->
        <button class="btn" type="submit" [disabled]="loading || form.invalid">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

        <div class="links">
          <a class="muted" href="#">Forgot your password?</a>
          <a class="accent" routerLink="/register">Create an account</a>
        </div>

        <p class="error" *ngIf="error">{{ error }}</p>

      </form>
    </div>
  </div>
</div>
