<div class="dashboard-shell">
  <div class="dashboard-overlay"></div>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand-card">
        <div class="logo-wrap">
          <div class="logo">🌿</div>
        </div>

        <div class="brand-text">
          <h2>Smart Irrigation</h2>
          <p>User Dashboard</p>
        </div>
      </div>

      <nav class="nav-links">
        <a routerLink="/user/tasks" routerLinkActive="active">
          <span class="icon">📋</span>
          <span>My Tasks</span>
        </a>

        <a routerLink="/user/analytics" routerLinkActive="active">
          <span class="icon">📊</span>
          <span>Analytics</span>
        </a>

        <a routerLink="/user/report" routerLinkActive="active">
          <span class="icon">📄</span>
          <span>Report</span>
        </a>
<a routerLink="/user/chatbot" routerLinkActive="active">
  <span class="icon">🤖</span>
  <span>Chatbot</span>
</a>
        <a routerLink="/user/profile" routerLinkActive="active">
          <span class="icon">👤</span>
          <span>Account</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <button class="logout-btn" (click)="logout()">
        <span>⏻</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="welcome-block">
        <h1>Welcome back 👋</h1>
        <p>Manage your irrigation system, monitor activity, and stay updated in real time.</p>
      </div>

      <div class="topbar-actions">
        <div class="notification-wrapper">
          <button class="notification-btn" (click)="toggleNotifications()">
            <span class="bell">🔔</span>
            <span class="notification-count" *ngIf="notifications.length > 0">
              {{ notifications.length }}
            </span>
          </button>

          <div class="notification-dropdown" *ngIf="showNotifications">
            <div class="notification-header">
              <h3>Notifications</h3>
              <button class="refresh-btn" (click)="loadNotifications()">↻</button>
            </div>

            <div *ngIf="loadingNotifications" class="notification-empty">
              Loading...
            </div>

            <div *ngIf="!loadingNotifications && notifications.length === 0" class="notification-empty">
              No notifications
            </div>

            <div class="notification-list" *ngIf="!loadingNotifications && notifications.length > 0">
              <div *ngFor="let notif of notifications" class="notification-item">
                <div class="notif-icon">🔔</div>
                <div class="notif-content">
                  <p class="notif-title">{{ notif }}</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="topbar-badge">
          <span class="dot"></span>
          <span>System Online</span>
          <span class="caret">⌄</span>
        </div>
      </div>
    </header>

    <section class="content-card">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
