<div class="auth">
  <div class="auth__left">
    <div class="brand">
      <div class="brand__logo">🌿</div>
      <div class="brand__name">Irrigation Manager</div>
    </div>
  </div>

  <div class="auth__right">
    <div class="card">
      <h1>Create an Account</h1>

      <form [formGroup]="form" (ngSubmit)="submit()">

        <!-- Full Name -->
        <label>Full Name</label>
        <div class="field">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-4.4 0-8 2-8 4.5V21h16v-2.5C20 16 16.4 14 12 14z"></path>
            </svg>
          </span>
          <input 
            type="text" 
            formControlName="fullName" 
            placeholder="John Smith" />
        </div>

        <!-- Email -->
        <label>Email Address</label>
        <div class="field">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M4 6h16v12H4V6zm8 7L5.5 8.5V8l6.5 4.5L18.5 8V8.5L12 13z"></path>
            </svg>
          </span>
          <input 
            type="email" 
            formControlName="email" 
            placeholder="example@email.com" />
        </div>

        <!-- Password -->
        <label>Password</label>
        <div class="field">
          <span class="icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V7z"></path>
            </svg>
          </span>
          <input 
            type="password" 
            formControlName="password" 
            placeholder="Create a strong password" />
        </div>

        <!-- Button -->
        <button class="btn" type="submit" [disabled]="loading || form.invalid">
          {{ loading ? 'Creating account...' : 'Create Account' }}
        </button>

        <div class="links">
          <a class="muted" routerLink="/login">Already have an account?</a>
          <a class="accent" routerLink="/login">Sign In</a>
        </div>

        <p class="error" *ngIf="error">{{ error }}</p>

      </form>
    </div>
  </div>
</div>
